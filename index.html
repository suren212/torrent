<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torrent Downloader</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --accent-dark: #0284c7;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --green: #22c55e;
    --red: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  p.subtitle { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  }
  label { display: block; font-size: 0.9rem; margin-bottom: 0.4rem; color: var(--muted); }
  input[type="text"], input[type="file"] {
    width: 100%;
    padding: 0.6rem 0.7rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0b1220;
    color: var(--text);
    font-size: 0.95rem;
  }
  .row { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  button {
    background: var(--accent-dark);
    color: white;
    border: none;
    padding: 0.6rem 1.1rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent); }
  .status { font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2em; }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }

  .torrent-item {
    background: var(--card);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 0.75rem;
  }
  .torrent-item .name { font-weight: 600; margin-bottom: 0.4rem; word-break: break-all; }
  .progress-bar {
    background: #0b1220;
    border-radius: 6px;
    overflow: hidden;
    height: 10px;
    margin: 0.4rem 0;
  }
  .progress-fill {
    background: linear-gradient(90deg, var(--accent-dark), var(--accent));
    height: 100%;
    transition: width 0.3s ease;
  }
  .meta { font-size: 0.8rem; color: var(--muted); display: flex; justify-content: space-between; }
  .files { margin-top: 0.5rem; font-size: 0.8rem; color: var(--muted); }
  .files ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }
  .remove-btn { background: transparent; color: var(--red); border: 1px solid var(--red); padding: 0.3rem 0.6rem; font-size: 0.8rem; }
  .remove-btn:hover { background: rgba(248,113,113,0.1); }
  .empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 1rem 0; }

  .tree-node { margin-bottom: 0.15rem; }
  .tree-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.45rem 0.5rem;
    border-radius: 6px;
  }
  .tree-row:hover { background: rgba(255,255,255,0.04); }
  .tree-label { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
  .tree-label .icon { flex-shrink: 0; }
  .tree-label .fname { word-break: break-all; }
  .tree-size { color: var(--muted); font-size: 0.78rem; margin-right: 0.6rem; white-space: nowrap; }
  .tree-children { margin-left: 1.4rem; border-left: 1px dashed #334155; padding-left: 0.6rem; }
  .download-link {
    background: var(--accent-dark);
    color: white;
    text-decoration: none;
    padding: 0.3rem 0.7rem;
    border-radius: 6px;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .download-link:hover { background: var(--accent); }
  .refresh-row { display:flex; justify-content:flex-end; margin-bottom:0.5rem; }
  .refresh-row button { font-size:0.8rem; padding:0.35rem 0.8rem; }
</style>
</head>
<body>
<div class="container">
  <h1>🧲 Torrent Downloader</h1>
  <p class="subtitle">Add a magnet link or upload a .torrent file. Files are saved to the <code>Download</code> folder on the server.</p>

  <div class="card">
    <label for="magnetInput">Magnet link</label>
    <div class="row">
      <div><input type="text" id="magnetInput" placeholder="magnet:?xt=urn:btih:..." /></div>
      <button id="addMagnetBtn">Add Magnet</button>
    </div>
    <div class="status" id="magnetStatus"></div>

    <hr style="border-color:#334155; margin: 1.25rem 0;" />

    <label for="fileInput">.torrent file</label>
    <div class="row">
      <div><input type="file" id="fileInput" accept=".torrent" /></div>
      <button id="addFileBtn">Upload & Add</button>
    </div>
    <div class="status" id="fileStatus"></div>
  </div>

  <h2 style="font-size:1.1rem;">Downloads</h2>
  <div id="torrentList"></div>

  <h2 style="font-size:1.1rem; margin-top:2rem;">Files in Download folder</h2>
  <div class="card" id="filesCard">
    <div class="refresh-row"><button id="refreshFilesBtn">Refresh</button></div>
    <div id="fileTree"></div>
  </div>
</div>

<script>
const magnetInput = document.getElementById('magnetInput');
const addMagnetBtn = document.getElementById('addMagnetBtn');
const magnetStatus = document.getElementById('magnetStatus');

const fileInput = document.getElementById('fileInput');
const addFileBtn = document.getElementById('addFileBtn');
const fileStatus = document.getElementById('fileStatus');

const torrentList = document.getElementById('torrentList');

function setStatus(el, message, isError) {
  el.textContent = message;
  el.className = 'status ' + (isError ? 'err' : 'ok');
}

addMagnetBtn.addEventListener('click', async () => {
  const magnet = magnetInput.value.trim();
  if (!magnet) return setStatus(magnetStatus, 'Please paste a magnet link.', true);
  setStatus(magnetStatus, 'Adding...', false);
  try {
    const res = await fetch('/api/add-magnet', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ magnet }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to add magnet.');
    setStatus(magnetStatus, 'Added! Downloading...', false);
    magnetInput.value = '';
    refresh();
  } catch (err) {
    setStatus(magnetStatus, err.message, true);
  }
});

addFileBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return setStatus(fileStatus, 'Please choose a .torrent file.', true);
  setStatus(fileStatus, 'Uploading...', false);
  try {
    const formData = new FormData();
    formData.append('torrentFile', file);
    const res = await fetch('/api/add-file', { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to add torrent file.');
    setStatus(fileStatus, 'Added! Downloading...', false);
    fileInput.value = '';
    refresh();
  } catch (err) {
    setStatus(fileStatus, err.message, true);
  }
});

function formatBytes(bytes) {
  if (!bytes) return '0 B';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  let n = bytes;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return n.toFixed(1) + ' ' + units[i];
}

async function removeTorrent(infoHash) {
  await fetch('/api/torrents/' + infoHash, { method: 'DELETE' });
  refresh();
}

async function refresh() {
  try {
    const res = await fetch('/api/torrents');
    const items = await res.json();

    if (!items.length) {
      torrentList.innerHTML = '<div class="empty">No downloads yet.</div>';
      return;
    }

    torrentList.innerHTML = items.map((t) => `
      <div class="torrent-item">
        <div class="name">${t.name || '(fetching metadata...)'}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${t.progress}%"></div></div>
        <div class="meta">
          <span>${t.progress}% — ${formatBytes(t.downloaded)} / ${formatBytes(t.total)}</span>
          <span>${t.done ? '✅ Done' : (t.error ? '❌ Error' : '⬇️ Downloading')}</span>
        </div>
        ${t.error ? `<div class="status err">${t.error}</div>` : ''}
        ${t.done && t.files.length ? `
          <div class="files">
            Files:
            <ul>${t.files.map(f => `<li>${f.path} (${formatBytes(f.length)})</li>`).join('')}</ul>
          </div>` : ''}
        <div style="margin-top:0.6rem; text-align:right;">
          <button class="remove-btn" onclick="removeTorrent('${t.id}')">Remove</button>
        </div>
      </div>
    `).join('');
  } catch (err) {
    console.error(err);
  }
}

refresh();
setInterval(refresh, 2000);

// --- Download folder file browser ---
const fileTree = document.getElementById('fileTree');
const refreshFilesBtn = document.getElementById('refreshFilesBtn');

function renderNode(node) {
  const downloadUrl = '/api/download/' + node.relPath.split('/').map(encodeURIComponent).join('/');
  if (node.type === 'file') {
    return `
      <div class="tree-node">
        <div class="tree-row">
          <div class="tree-label">
            <span class="icon">📄</span>
            <span class="fname">${node.name}</span>
          </div>
          <div style="display:flex; align-items:center;">
            <span class="tree-size">${formatBytes(node.size)}</span>
            <a class="download-link" href="${downloadUrl}" download>Download</a>
          </div>
        </div>
      </div>`;
  }
  // folder
  const childrenHtml = node.children.map(renderNode).join('');
  return `
    <div class="tree-node">
      <div class="tree-row">
        <div class="tree-label">
          <span class="icon">📁</span>
          <span class="fname">${node.name}</span>
        </div>
        <div style="display:flex; align-items:center;">
          <span class="tree-size">${formatBytes(node.size)}</span>
          <a class="download-link" href="${downloadUrl}" download>Download .zip</a>
        </div>
      </div>
      <div class="tree-children">${childrenHtml}</div>
    </div>`;
}

async function refreshFiles() {
  try {
    const res = await fetch('/api/files');
    const tree = await res.json();
    if (!tree.length) {
      fileTree.innerHTML = '<div class="empty">Download folder is empty.</div>';
      return;
    }
    fileTree.innerHTML = tree.map(renderNode).join('');
  } catch (err) {
    console.error(err);
  }
}

refreshFilesBtn.addEventListener('click', refreshFiles);
refreshFiles();
setInterval(refreshFiles, 5000);
</script>
</body>
</html>
